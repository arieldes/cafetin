<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cafetín</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="hero">

    <header>

        <h1 id="titulo"></h1>

        <p id="mensaje"></p>

    </header>

    <section class="card">

        <div class="contenido">

            <div class="personaje">

                <img
                    src="assets/img/cafetin1.png"
                    alt="Cafetín"
                    id="cafetin">

                <p class="frase">

                    ¡Cada aporte nos acerca al próximo café!

                </p>

        </div>

        <div class="progreso">

            <div class="fila">

                <div>

                    <span class="etiqueta">Recaudado</span>

                    <h2 id="recaudado"></h2>

                </div>

                <div>

                    <span class="etiqueta">Meta</span>

                    <h2 id="meta"></h2>

                </div>

            </div>

            <div class="barra">

                <div id="progreso"></div>

            </div>

            <h3 id="porcentaje"></h3>
            
            <p id="faltante"></p>

        </div>

    </section>

   
    <footer>

        Última actualización

        <br>

        <strong id="fecha"></strong>

    </footer>

</div>

<script src="script.js"></script>

</body>
</html>
